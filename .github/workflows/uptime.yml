# An EXTERNAL monitor for the live calendar.
#
# nasi-health.timer already runs on the VPS every 5 minutes and repairs what it
# can. What it cannot do, by definition, is notice that the whole box is gone --
# a check running on the machine it is checking reports nothing when the machine
# is off. This runs on GitHub's infrastructure instead, so it survives the VPS.
#
# When this job fails, GitHub emails the repository owner and opens an issue.
# The issue is what makes an outage impossible to scroll past, and it closes
# itself when the site comes back.
#
# Notes on the schedule: GitHub's cron is best-effort and can be minutes late
# under load, so treat "every 10 minutes" as approximate -- it is a safety net,
# not a stopwatch. GitHub also disables scheduled workflows after 60 days with
# no repository activity, and emails a warning first; if that happens, re-enable
# it from the Actions tab.

name: uptime

on:
  schedule:
    # Every 30 minutes, not 10. On 1 Sep the runner failed to reach the VPS
    # twice in an hour for ~5 minutes at a stretch, while the box itself sat at
    # 11h uptime, zero restarts, answering in 160ms from two other networks.
    # That is a routing problem between Azure and Hostinger, and it reaches no
    # actual subscriber -- but at one run per 10 minutes it was going to page
    # him several times a day about a site that was never down.
    #
    # So: check less often, and tolerate far more within one check. A real
    # outage is still caught within ~45 min worst case (30 min to the next run
    # plus 15 min of retrying), which is ample for a feed that calendar clients
    # refetch every 12 hours. A five-minute partition now passes unnoticed,
    # which is the correct outcome for something no reader can perceive.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # so you can run it by hand from the Actions tab

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live site
        id: probe
        run: |
          # GitHub runs every `run:` block with `bash -eo pipefail`, so -e is
          # already ON and `set -uo pipefail` below does NOT remove it. That
          # killed this step on 1 Sep: when curl could not reach the site it
          # wrote no output file, reading that missing file was a shell error,
          # and -e ended the step before it could report anything. A monitor
          # dying on the one condition it exists to detect is the worst failure
          # mode available to it -- it looked identical to a broken workflow.
          set -uo pipefail
          set +e
          HOST=nasi.ibrahimabdelrahim.cloud
          BASE="https://$HOST"
          FEED="$BASE/data/nasi-cairo-full-5y.ics"

          fail=""
          for attempt in 1 2 3 4 5; do
            fail=""
            # Created empty first, every attempt: curl does not write these at
            # all on a connection failure, and an absent file is what turned an
            # unreachable site into a dead step rather than an alert.
            : > /tmp/h
            : > /tmp/f

            # 1. liveness -- three bytes, this is the cheap one
            code=$(curl -sS -m 20 -o /tmp/h -w '%{http_code}' "$BASE/healthz" 2>/dev/null)
            code=${code:-000}
            # capped: a wrong response can be an entire HTML error page, and
            # this string goes into $GITHUB_OUTPUT, which is key=value parsed
            body=$(tr -d '[:space:]' < /tmp/h 2>/dev/null | head -c 40)
            [ "$code" = "200" ] || fail="$fail healthz=HTTP$code"
            [ "$body" = "ok" ]  || fail="$fail healthz-body='$body'"

            # 2. a real feed. /healthz only proves the process is listening; a
            #    generator that answers 200 with the wrong body is exactly the
            #    failure that would otherwise go unnoticed, because subscribers
            #    simply stop getting updates and nothing says so.
            # 45s, not 90: the feed answers in well under a second, and
            # three attempts at 90 plus the sleeps did not comfortably fit the
            # ten-minute schedule once anything went slow.
            fcode=$(curl -sS -m 45 -o /tmp/f -w '%{http_code}' "$FEED" 2>/dev/null)
            fcode=${fcode:-000}
            [ "$fcode" = "200" ] || fail="$fail feed=HTTP$fcode"
            head=$(head -c 15 /tmp/f 2>/dev/null)
            [ "$head" = "BEGIN:VCALENDAR" ] || fail="$fail feed-not-icalendar"
            # NOT a byte floor. This was `-ge 1000000`, written when the feed
            # was 2.5 MB, and it broke the moment the feed was simplified to one
            # entry per day (700 KB) -- 57 consecutive false failures and ~50
            # emails before anyone noticed the site was fine. A size in bytes is
            # a proxy for "not truncated", so check that directly instead: a
            # complete calendar ENDS with END:VCALENDAR, and a real one has
            # events in it. Both survive any future change to how verbose an
            # entry is.
            tail -c 200 /tmp/f | grep -q "END:VCALENDAR" || fail="$fail feed-truncated"
            events=$(grep -c "^BEGIN:VEVENT" /tmp/f 2>/dev/null)
            events=${events:-0}
            [ "$events" -ge 1000 ] || fail="$fail feed-only-${events}-events"

            # 3. certificate. certbot renews at 30 days left, so under 10 means
            #    renewal has been failing quietly for weeks.
            # `timeout 20`, because this was the ONE command here with no
            # bound on it. On 1 Sep a probe ran for 13m 14s against a schedule
            # that fires every 10 minutes -- runs queued behind each other and
            # the whole check fell behind. curl was always bounded; openssl
            # was not, and a hung TLS handshake waits forever.
            cert=$(timeout 20 openssl s_client -connect "$HOST:443" \
                     -servername "$HOST" </dev/null 2>/dev/null)
            end=$(printf '%s' "$cert" | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -n "$end" ]; then
              left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
              echo "certificate: $left days left"
              [ "$left" -ge 10 ] || fail="$fail cert-expires-in-${left}d"
            elif [ "$code" = "200" ] && [ "$fcode" = "200" ]; then
              # Unreadable, but the site and the feed both answered over HTTPS
              # in the same breath -- so TLS demonstrably works and this is a
              # failed MEASUREMENT, not a bad certificate. Reporting it as an
              # outage is how a flaky s_client from the runner turns into an
              # alarm about a site that is fine, which is precisely the failure
              # mode this workflow spent the morning demonstrating.
              echo "certificate: could not read it, but HTTPS served both"                    "checks, so TLS is working -- not treating this as down"
            else
              # nothing else worked either, so this is real
              fail="$fail cert-unreadable"
            fi

            if [ -z "$fail" ]; then
              echo "attempt $attempt: all checks passed"
              break
            fi
            echo "attempt $attempt failed:$fail"
            # a single blip on GitHub's side must not raise an issue
            # 5 attempts x (20 + 45 + 20)s of timeouts, spaced 120s apart, is
            # just over 15 minutes of continuous unreachability before this
            # calls the site down. Sized deliberately against the observed
            # ~5-minute partitions rather than guessed.
            [ "$attempt" -lt 5 ] && sleep 120
          done

          if [ -n "$fail" ]; then
            # trim the leading space, and cap the whole thing -- $GITHUB_OUTPUT
            # is line-based and an unbounded value would break it
            reason=$(echo "$fail" | sed 's/^ *//' | head -c 300)
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "status=down" >> "$GITHUB_OUTPUT"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue if it is down
        if: steps.probe.outputs.status == 'down'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          # Not `set -e`: if gh fails here the outage is still real, and the
          # failing job is itself the alert. Losing the `exit 1` below to a
          # bookkeeping error would turn a genuine outage into silence.
          set -uo pipefail
          # one open issue per outage, not one per run
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                       --label uptime --state open --limit 1 \
                       --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            # Deliberately silent. This used to comment every run and fail the
            # job every run: at one run per 10 minutes that was 53 comments and
            # ~50 emails for a SINGLE incident, which trains him to ignore the
            # alert -- the opposite of the point. The open issue is the standing
            # signal; one notification per outage is the whole job. Exit 0 so
            # GitHub does not send a failure mail for a fault already reported.
            echo "issue #$existing is already open for this outage; staying quiet"
            exit 0
          else
            gh label create uptime --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Automated uptime check" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label uptime \
              --title "Site is down: $(date -u +%F\ %H:%M) UTC" \
              --body "$(printf 'The external uptime check could not reach the live calendar.\n\n**Failing:** `%s`\n\n- Site: https://nasi.ibrahimabdelrahim.cloud/\n- Liveness: https://nasi.ibrahimabdelrahim.cloud/healthz\n\nThe on-box check (`nasi-health.timer`) repairs what it can every 5 minutes. If this issue is open, that did not work — or the box itself is unreachable.\n\nThis issue closes itself when the site responds again.\n\nRun: %s/%s/actions/runs/%s\n' "$REASON" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" \
              || echo "could not open an issue; the failing job is still the alert"
          fi
          exit 1

      - name: Close the issue if it recovered
        if: steps.probe.outputs.status == 'up'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # NOT `set -e`, and this is the bug that cried wolf the second time.
          # The probe has just confirmed the site is healthy, so anything that
          # goes wrong in here is bookkeeping, not an outage -- but
          # `gh issue list --label uptime` errors when that label does not
          # exist, and under `set -e` that failed the job on every single run
          # while the site was fine. A monitor whose CLEANUP path can raise a
          # false alarm is worse than no monitor, because the alarm is
          # indistinguishable from the real thing.
          set -uo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                       --label uptime --state open --limit 1 \
                       --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Back up at $(date -u +%FT%TZ). Closing." || true
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" || true
            echo "closed #$existing"
          else
            echo "up, nothing to close"
          fi
          exit 0
