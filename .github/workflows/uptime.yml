# An EXTERNAL monitor for the live calendar.
#
# nasi-health.timer already runs on the VPS every 5 minutes and repairs what it
# can. What it cannot do, by definition, is notice that the whole box is gone --
# a check running on the machine it is checking reports nothing when the machine
# is off. This runs on GitHub's infrastructure instead, so it survives the VPS.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE WAS REWRITTEN (1 Sep 2026)
#
# It raised four alarms in one afternoon. All four were false. The site served
# every request throughout, from three other networks, with the box at 11h
# uptime and zero restarts. The tell is in the issues it opened and closed
# itself:
#
#     #1  16:28 -> 16:46   18 min
#     #2  17:25 -> 17:32    7 min
#     #3  17:56 -> 18:02    6 min
#     #4  19:49 -> 20:07   18 min
#
# Every single one cleared on the very next scheduled run. Not one persisted
# across two runs. A real outage does not politely end four times in a row
# exactly when a fresh VM picks up the job -- but a runner whose own network is
# broken looks precisely like this, because the next run gets a different VM.
#
# The old design could not tell those two apart, and worse, could not even
# describe what it saw. Its verdict was:
#
#     healthz=HTTP000 healthz-body='' feed=HTTP000 feed-not-icalendar
#     feed-truncated feed-only-0-events cert-unreadable
#
# which reads like the site is catastrophically broken. In fact it is one fact
# stated seven times: the connection never opened. curl's `2>/dev/null` threw
# away the one string that said whether that was DNS, a refused connection, a
# timeout or TLS -- so four failures produced zero usable evidence and cost a
# whole day of guessing. Everything below follows from that.
#
# Three rules now:
#
#   1. NEVER discard the reason. curl's exit code and stderr are the diagnosis.
#      A body check is not allowed to run on a response that never arrived.
#   2. A single vantage point may not declare an outage. It can only report
#      "I could not reach it", which is a statement about the prober. Three
#      independent VMs must agree, and any VM whose own network is broken is
#      recused rather than counted.
#   3. The job always exits 0. The ISSUE is the alert. Exiting non-zero sent a
#      second "Run failed" email that fires for workflow bugs too -- which is
#      what almost every mail on 1 Sep actually was.
# ---------------------------------------------------------------------------
#
# GitHub disables scheduled workflows after 60 days with no repository
# activity, and emails a warning first; re-enable it from the Actions tab.

name: uptime

on:
  schedule:
    # Every 30 minutes. This is a safety net, not a stopwatch: the feed is an
    # .ics that calendar clients refetch every 12-24 hours, so a fifteen-minute
    # blip is imperceptible to every actual subscriber. GitHub's cron is
    # best-effort and can drift by minutes under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # so you can run it by hand from the Actions tab

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Three independent probes, on three separate runner VMs.
  #
  # Each one reports ONLY what it personally observed, and each one first
  # proves its own network works before it is allowed an opinion about anyone
  # else's. They do not talk to each other; the `decide` job below counts the
  # votes.
  # ==========================================================================
  probe:
    name: probe ${{ matrix.vantage }}
    runs-on: ubuntu-latest
    # The last hole through which a "Run failed" email could still escape. A
    # probe job that errors for its own reasons -- a runner dying, an action
    # being unavailable -- would otherwise make the whole run conclude
    # `failure`, and GitHub mails that exactly as loudly as a real outage.
    # With this, a broken vantage simply uploads no verdict and does not vote,
    # which `decide` already handles as one fewer voter.
    continue-on-error: true
    strategy:
      fail-fast: false      # one vantage failing must not cancel the others
      matrix:
        vantage: [1, 2, 3]
    steps:
      - name: Probe the live site
        run: |
          # GitHub runs every `run:` block with `bash -eo pipefail`, so -e is
          # already ON and `set -uo pipefail` does NOT remove it. That killed
          # this step once: curl wrote no output file when it could not
          # connect, reading the missing file was an error, and -e ended the
          # step before it could report anything. A monitor that dies on the
          # one condition it exists to detect is the worst failure available
          # to it, because it looks identical to a broken workflow.
          set -uo pipefail
          set +e

          HOST=nasi.ibrahimabdelrahim.cloud
          BASE="https://$HOST"
          FEED="$BASE/data/nasi-cairo-full-5y.ics"
          # A third party with no relationship to the VPS. If THIS is
          # unreachable, the runner's own egress is broken and nothing it says
          # about the calendar means anything.
          CONTROL="https://api.github.com/"

          verdict=up          # up | down | recused
          class=ok
          detail=""

          note() { detail="${detail}${detail:+; }$1"; }

          # curl's exit code is the diagnosis the old version threw away.
          why() {
            case "$1" in
              0)  echo "ok" ;;
              6)  echo "dns" ;;             # could not resolve the name
              7)  echo "connect" ;;         # refused / no route
              28) echo "timeout" ;;
              35|51|58|59|60|77|83) echo "tls" ;;
              56) echo "recv" ;;            # connection reset mid-transfer
              *)  echo "curl$1" ;;
            esac
          }

          # Sets RC, CODE and ERR. ERR is curl's own words, capped, because it
          # ends up in an issue body and a job summary.
          fetch() {   # $1=url  $2=body-file  $3=timeout  [$4..]=extra curl args
            local url=$1 out=$2 tmo=$3; shift 3
            : > "$out"
            CODE=$(curl -sS -m "$tmo" -o "$out" -w '%{http_code}' "$@" "$url" 2>/tmp/curlerr)
            RC=$?
            CODE=${CODE:-000}
            ERR=$(tr -d '\r' < /tmp/curlerr | tail -1 | head -c 160)
          }

          echo "::group::vantage ${{ matrix.vantage }}"

          # ---- 0. Does this runner's network work at all? ------------------
          # Asked FIRST and answered honestly. A VM with broken egress must
          # recuse itself, not convict the site.
          fetch "$CONTROL" /tmp/ctl 20
          if [ "$RC" -ne 0 ]; then
            verdict=recused
            class="runner-network"
            note "control $CONTROL failed: $(why $RC) rc=$RC ${ERR:+($ERR)}"
            note "this runner cannot reach the wider internet, so it has no opinion about the calendar"
            echo "RECUSED: $detail"
          else
            echo "control ok (HTTP $CODE) -- this runner's network is fine"
          fi

          if [ "$verdict" != "recused" ]; then
            # ---- 1. liveness ----------------------------------------------
            fetch "$BASE/healthz" /tmp/h 20
            hrc=$RC; hcode=$CODE; herr=$ERR
            if [ "$hrc" -ne 0 ]; then
              verdict=down; class=$(why $hrc)
              note "healthz: $(why $hrc) ${herr:+($herr)}"
            elif [ "$hcode" != "200" ]; then
              verdict=down; class=http
              note "healthz: HTTP $hcode"
            else
              # Only NOW is looking at the body meaningful. The old version
              # graded a file that was never written and reported the empty
              # string as a wrong answer.
              hbody=$(tr -d '[:space:]' < /tmp/h | head -c 40)
              if [ "$hbody" != "ok" ]; then
                verdict=down; class=content
                note "healthz answered 200 but said '$hbody', not 'ok'"
              fi
            fi

            # ---- 2. a real feed -------------------------------------------
            # /healthz only proves a process is listening. A generator that
            # answers 200 with the wrong body is exactly the failure that
            # would otherwise go unnoticed: subscribers quietly stop getting
            # updates and nothing says so.
            fetch "$FEED" /tmp/f 45
            frc=$RC; fcode=$CODE; ferr=$ERR
            if [ "$frc" -ne 0 ]; then
              verdict=down; [ "$class" = ok ] && class=$(why $frc)
              note "feed: $(why $frc) ${ferr:+($ferr)}"
            elif [ "$fcode" != "200" ]; then
              verdict=down; [ "$class" = ok ] && class=http
              note "feed: HTTP $fcode"
            else
              # NOT a byte floor. It was `-ge 1000000`, written when the feed
              # was 2.5 MB, and it broke the moment the feed was simplified to
              # one entry per day (700 KB): 57 consecutive false failures and
              # ~50 emails before anyone noticed the site was fine. Size is a
              # proxy for "not truncated", so check that directly. A complete
              # calendar ENDS with END:VCALENDAR and has events in it -- both
              # survive any future change to how verbose an entry is. The
              # floor is 100, not 1826, for the same reason: it must prove
              # "this is a real calendar", not "this is today's calendar".
              head=$(head -c 15 /tmp/f)
              events=$(grep -c '^BEGIN:VEVENT' /tmp/f); events=${events:-0}
              if [ "$head" != "BEGIN:VCALENDAR" ]; then
                verdict=down; [ "$class" = ok ] && class=content
                note "feed does not begin with BEGIN:VCALENDAR"
              elif ! tail -c 200 /tmp/f | grep -q 'END:VCALENDAR'; then
                verdict=down; [ "$class" = ok ] && class=content
                note "feed is truncated -- no END:VCALENDAR"
              elif [ "$events" -lt 100 ]; then
                verdict=down; [ "$class" = ok ] && class=content
                note "feed has only $events events"
              else
                echo "feed ok: $events events, $(wc -c < /tmp/f) bytes"
              fi
            fi

            # ---- 3. was it the NAME or the SITE? --------------------------
            # If we could not connect, ask an independent resolver over DoH
            # and try the address directly, keeping SNI and full certificate
            # validation. If that works, the site is up and this runner's
            # resolver or route was the whole problem -- which is a fact about
            # the prober, so it recuses itself rather than raising an alarm.
            case "$class" in
              dns|connect|timeout)
                ip=$(curl -sS -m 15 -H 'accept: application/dns-json' \
                       "https://cloudflare-dns.com/dns-query?name=$HOST&type=A" 2>/dev/null \
                     | grep -oP '"data":"\K[0-9.]+' | head -1)
                if [ -n "$ip" ]; then
                  note "an independent resolver says $HOST is $ip"
                  fetch "$BASE/healthz" /tmp/b 25 --resolve "$HOST:443:$ip"
                  if [ "$RC" -eq 0 ] && [ "$CODE" = "200" ]; then
                    verdict=recused
                    class="local-resolver"
                    note "connecting straight to $ip served healthz 200, so the site is UP and this runner's DNS or route was the fault"
                  else
                    note "connecting straight to $ip also failed: $(why $RC) ${ERR:+($ERR)}"
                  fi
                else
                  note "could not get an independent answer for $HOST either"
                fi
                ;;
            esac

            # ---- 4. certificate -------------------------------------------
            # Only meaningful if TLS demonstrably works. certbot renews at 30
            # days left, so under 10 means renewal has been failing quietly
            # for weeks. Skipped entirely when we never connected, because an
            # unreadable certificate on an unreachable host is not a second
            # piece of evidence -- it is the same one, restated.
            if [ "$verdict" = "up" ]; then
              end=$(timeout 20 openssl s_client -connect "$HOST:443" \
                      -servername "$HOST" </dev/null 2>/dev/null \
                    | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
              if [ -n "$end" ]; then
                left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
                echo "certificate: $left days left"
                if [ "$left" -lt 10 ]; then
                  verdict=down; class=cert
                  note "certificate expires in $left days and renewal is evidently stuck"
                fi
              else
                # HTTPS just served two requests, so TLS works and this is a
                # failed MEASUREMENT, not a bad certificate.
                echo "certificate: unreadable, but HTTPS served both checks -- not an outage"
              fi
            fi
          fi

          echo "::endgroup::"
          echo "VERDICT: $verdict ($class) $detail"

          mkdir -p verdicts
          {
            echo "$verdict"
            echo "$class"
            echo "$detail"
          } > "verdicts/vantage-${{ matrix.vantage }}.txt"

      - name: Record this vantage's verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vantage-${{ matrix.vantage }}
          path: verdicts/
          retention-days: 7

  # ==========================================================================
  # Count the votes.
  #
  # A vantage that recused itself does not vote -- its network was broken, so
  # its silence is not evidence either way. An alarm needs at least two
  # remaining vantages and needs them UNANIMOUS. If any VM anywhere fetched a
  # healthy feed, the site is up and that settles it: one machine succeeding
  # proves the site serves, while one machine failing proves only that one
  # machine failed.
  # ==========================================================================
  decide:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect every vantage's verdict
        # Tolerant on purpose. If no vantage managed to upload anything, this
        # step erroring would fail the job and send the very email this
        # rewrite exists to stop. Zero verdicts is handled below as
        # 'inconclusive', which is exactly what it is.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: verdicts
          pattern: vantage-*
          merge-multiple: true

      - name: Decide, and alert only if the evidence supports it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately NOT `set -e`, and this step NEVER exits non-zero.
          # A failing job sends its own "Run failed" email, which fires for
          # workflow bugs exactly as loudly as for outages -- that is what
          # produced almost every alarming mail on 1 Sep. The issue below is
          # the alert. If this bookkeeping breaks, that is a bug to fix, not
          # an outage to announce.
          set -uo pipefail
          set +e

          up=0; down=0; recused=0; evidence=""; dclass=""
          for f in verdicts/vantage-*.txt; do
            [ -f "$f" ] || continue
            v=$(sed -n 1p "$f"); c=$(sed -n 2p "$f"); d=$(sed -n 3p "$f")
            who=$(basename "$f" .txt)
            case "$v" in
              up)      up=$((up+1)) ;;
              down)    down=$((down+1)); dclass=${dclass:-$c} ;;
              recused) recused=$((recused+1)) ;;
              *)       recused=$((recused+1)); v=recused; c=no-verdict ;;
            esac
            echo "$who: $v ($c) $d"
            evidence="${evidence}- **${who}** — ${v} (${c})${d:+: ${d}}"$'\n'
          done

          voters=$((up + down))
          echo "tally: up=$up down=$down recused=$recused (voters=$voters)"

          # ---- the decision -----------------------------------------------
          if [ "$up" -gt 0 ]; then
            state=up
            headline="Site is UP — $up of $voters vantages fetched a healthy feed."
          elif [ "$voters" -ge 2 ] && [ "$down" -eq "$voters" ]; then
            state=down
            headline="Site is DOWN — all $voters independent vantages agree."
          else
            # One lone vantage, or none. Not enough to convict.
            state=inconclusive
            headline="Inconclusive — only $voters vantage(s) reached a verdict ($recused recused for broken runner networking). Not raising an alarm on that."
          fi

          # ---- the referee -------------------------------------------------
          # `decide` runs on a FOURTH runner, minutes after the three probes
          # finished. Before anything reaches his inbox, that machine looks
          # for itself. It costs nothing and it adds both another independent
          # vantage and another moment in time -- the two axes on which every
          # false alarm today was wrong. It is the last thing standing between
          # a prober-side fault and an email.
          #
          # It may only ever DOWNGRADE an alarm, never raise one: a single
          # machine failing has never been evidence of an outage, which is the
          # entire lesson of this file.
          if [ "$state" = "down" ]; then
            REF="https://nasi.ibrahimabdelrahim.cloud/data/nasi-cairo-full-5y.ics"
            rcode=$(curl -sS -m 30 -o /tmp/ref -w '%{http_code}' "$REF" 2>/tmp/referr)
            rrc=$?
            ok=no
            if [ "$rrc" -eq 0 ] && [ "$rcode" = "200" ]; then
              head -c 15 /tmp/ref | grep -q 'BEGIN:VCALENDAR' &&
                tail -c 200 /tmp/ref | grep -q 'END:VCALENDAR' && ok=yes
            fi
            if [ "$ok" = yes ]; then
              state=up
              headline="Site is UP — the probes could not reach it, but this fourth machine just fetched a complete feed, so their networks were at fault and not the site."
              evidence="${evidence}- **referee** — fetched a complete feed ($(wc -c < /tmp/ref) bytes) from the deciding runner, so the site is serving"$'\n'
              echo "referee OVERRULES the probes: the site served me a complete feed"
            else
              rerr=$(tr -d '\r' < /tmp/referr 2>/dev/null | tail -1 | head -c 160)
              evidence="${evidence}- **referee** — could not reach it either (rc=$rrc HTTP $rcode)${rerr:+: $rerr}"$'\n'
              headline="$headline A fourth machine, checked separately, could not reach it either."
              echo "referee agrees: rc=$rrc code=$rcode $rerr"
            fi
          fi

          {
            echo "## $headline"
            echo
            echo "$evidence"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$headline"

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                       --label uptime --state open --limit 1 \
                       --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ "$state" = "down" ]; then
            if [ -n "$existing" ]; then
              # Deliberately silent. This used to comment on every run: at one
              # run per 10 minutes that was 53 comments and ~50 emails for a
              # SINGLE incident, which trains him to ignore the alert -- the
              # exact opposite of the point. The open issue is the standing
              # signal; one notification per outage is the whole job.
              echo "issue #$existing is already open for this outage; staying quiet"
            else
              gh label create uptime --repo "$GITHUB_REPOSITORY" \
                --color B60205 --description "Automated uptime check" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label uptime \
                --title "$(if [ "$dclass" = cert ]; then
                            echo "Certificate is close to expiry: $(date -u +%F\ %H:%M) UTC"
                          else
                            echo "Site is down: $(date -u +%F\ %H:%M) UTC"
                          fi)" \
                --body "$(printf 'All independent vantage points failed to reach the live calendar.\n\n%s\n- Site: https://nasi.ibrahimabdelrahim.cloud/\n- Liveness: https://nasi.ibrahimabdelrahim.cloud/healthz\n\nThe on-box check (`nasi-health.timer`) repairs what it can every 5 minutes. If this issue is open, that did not work — or the box itself is unreachable.\n\nThis issue closes itself when the site responds again.\n\nRun: %s/%s/actions/runs/%s\n' "$evidence" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" \
                || echo "could not open an issue"
            fi
          elif [ "$state" = "up" ] && [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Back up at $(date -u +%FT%TZ). Closing." || true
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" || true
            echo "closed #$existing"
          else
            echo "nothing to do"
          fi

          # Always. The issue is the alert; the job is just the machinery.
          exit 0
